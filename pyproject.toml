[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# When `pytest` is invoked directly (as CI does), the working directory is not
# added to sys.path — unlike `python -m pytest`. Adding it explicitly so
# `import src` works either way.
pythonpath = ["."]
markers = [
    "slow: tests that download and run the real model (skipped in CI; locally: pytest -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: basic errors, I: import order, B: common pitfalls, UP: outdated syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# A Streamlit app runs top to bottom; module-level code is normal here.
"app.py" = ["E402"]
# Scripts import after setting up sys.path.
"scripts/*.py" = ["E402"]
