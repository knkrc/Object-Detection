name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # opencv'nin ihtiyac duydugu sistem kutuphaneleri (headless ortamda yok)
      - name: Sistem bagimliliklari
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # PyPI'daki torch, Linux'ta CUDA paketlerini de cekiyor (~2.5 GB).
      # CPU deposundan kurmak indirmeyi ciddi olcude kucultuyor.
      - name: torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Bagimliliklar
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Gercek modeli indirip calistiran testler `slow` isaretli; CI'da atlanir,
      # yerelde `pytest -m slow` ile calistirilir.
      - name: Testler
        run: pytest -m "not slow" --cov=src --cov-report=term-missing

  docker:
    name: Docker imaji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Imaji derle
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: object-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Imajin sadece derlenmesi yetmez; gercekten ayaga kalkip cevap
      # verdigini de gormek istiyoruz.
      - name: Konteyneri baslat
        run: docker run -d --name od -p 8501:8501 object-detection:ci

      - name: Saglik kontrolu
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "\nuygulama ayakta"
              exit 0
            fi
            sleep 2
          done
          echo "uygulama 60 saniyede ayaga kalkmadi"
          docker logs od
          exit 1

      # Sunucu modunda webcam sekmesi olmamali (DEPLOYED=1 Dockerfile'da ayarli)
      - name: Webcam sekmesi gizli mi
        run: |
          docker exec od python -c "
          from src.config import is_deployed
          assert is_deployed(), 'DEPLOYED ayarli degil, webcam sekmesi gorunur kalirdi'
          print('sunucu modu aktif, webcam sekmesi gizli')
          "

      - name: Loglar
        if: always()
        run: docker logs od
