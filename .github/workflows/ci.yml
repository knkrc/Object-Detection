name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # System libraries opencv needs (absent in a headless runner)
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      # The PyPI torch build pulls CUDA packages on Linux (~2.5 GB).
      # Installing from the CPU index shrinks the download considerably.
      - name: torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Tests that download and run the real model are marked `slow`; skipped
      # here, run locally with `pytest -m slow`.
      - name: Tests
        run: pytest -m "not slow" --cov=src --cov-report=term-missing

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: object-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building the image is not enough; we want to see it actually come up
      # and respond.
      - name: Image size
        run: docker images object-detection:ci --format "{{.Size}}"

      - name: Start container
        run: docker run -d --name od -p 8501:8501 object-detection:ci

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo "the app is up"
              exit 0
            fi
            sleep 2
          done
          echo "the app did not come up within 60 seconds"
          docker logs od
          exit 1

      # In server mode there must be no webcam tab (DEPLOYED=1 in the Dockerfile)
      - name: Is the webcam tab hidden
        run: |
          docker exec od python -c "
          from src.config import is_deployed
          assert is_deployed(), 'DEPLOYED is not set; the webcam tab would show'
          print('server mode active, webcam tab hidden')
          "

      - name: Logs
        if: always()
        run: docker logs od
