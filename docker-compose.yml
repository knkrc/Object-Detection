# To run it locally with one command:
#   docker compose up --build
# Then open http://localhost:8501

services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Set to 0 to see the webcam tab locally. Note the container has no
      # access to the host camera; on macOS and Windows it will not work anyway.
      DEPLOYED: "1"
    volumes:
      # Keep processed videos outside the container
      - ./outputs:/home/user/app/outputs
    restart: unless-stopped
